<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#06060f;overflow:hidden;font-family:Georgia,serif;transition:background 0.3s;touch-action:none;-ms-touch-action:none;position:fixed;width:100%;height:100%}
@media(prefers-color-scheme:light){body{background:#F5F0E8}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#root{width:100vw;height:100vh}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;top:-100%;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;background:#C9A84C;color:#06060f;font-weight:700;font-size:14px;border-radius:0 0 8px 8px;text-decoration:none;transition:top 0.2s}
.skip-link:focus{top:0}
:focus-visible{outline:2px solid #C9A84C;outline-offset:2px}
#boot-fallback{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;font-family:Georgia,serif;color:#E8DCC8;text-align:center;background:#06060f}
noscript #boot-fallback{display:flex}
</style>

<a class="skip-link" href="#timeline-controls">Skip to timeline</a>
